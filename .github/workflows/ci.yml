name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/setup_environment.py
      - run: .venv/bin/python -B scripts/check_environment.py --dev
      - run: .venv/bin/python -B -m pytest -q
      - run: .venv/bin/python -B scripts/smoke_v1.py --skip-tests
